name: CI

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/ci.yml"]

defaults:
  run:
    working-directory: web

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # One step on purpose: `npm run verify` is the gate CLAUDE.md §7 names, so
      # running the same command is the only way CI cannot drift away from it.
      # Listing lint/typecheck/build separately is how the `test` step went
      # missing here in the first place.
      - name: Verify
        run: npm run verify
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_build_placeholder
          CLERK_SECRET_KEY: sk_test_ci_build_placeholder
          ANSWER_PROVIDER: stub
